name: Go Build and Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'it/**/*.json'
      - 'Dockerfile'
      - '.github/workflows/go.yml'
      - '.dagger/**'
      - 'dagger.toml'
      - 'dagger.lock'
      - 'scripts/ci/**'
  pull_request:
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'it/**/*.json'
      - 'Dockerfile'
      - '.github/workflows/go.yml'
      - '.dagger/**'
      - 'dagger.toml'
      - 'dagger.lock'
      - 'scripts/ci/**'
  workflow_dispatch:

# Pushes to main run one at a time, in merge order, so their deploys reach the
# infra Deploy Router in merge order. queue: max keeps every waiting run; the
# default keeps only the newest and cancels the rest.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'main' || github.run_id }}
  queue: max

jobs:
  # Lint and tests are Dagger checks (dagger.toml, .dagger/modules/runner):
  # `dagger check` runs them the same way on a laptop. This public repository
  # stays on GitHub-hosted runners, so each run starts a cold engine.
  dagger-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      DAGGER_VERSION: v1.0.0-beta.24
      DAGGER_ENGINE: image://registry.dagger.io/engine:v1.0.0-beta.24
      DAGGER_NO_NAG: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Install the Dagger CLI
        run: ./scripts/ci/install-dagger.sh "$RUNNER_TEMP/dagger-bin"
      - name: Run every check
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/dagger-bin:$PATH"
          dagger check --progress=report

  docker-push:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    needs: [dagger-check]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      deploy_image_tag: ${{ steps.deploy_tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/echopoint-runner
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=echopoint-runner
            org.opencontainers.image.description=Self-hosted flow runner for Echopoint
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Immutable tag for deploys. `latest` moves, so a redeploy of "latest"
      # cannot be traced back to a commit; this matches the `type=sha,
      # prefix={{branch}}-` tag pushed above (docker/metadata-action's short
      # sha is 7 chars) and doubles as the COMMIT_SHA label infra applies.
      - name: Resolve deploy image tag
        id: deploy_tag
        shell: bash
        run: |
          set -euo pipefail
          printf 'tag=%s-%s\n' "${GITHUB_REF_NAME}" "${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  # Auto-deploy on main: dev first, then infra's router promotes to prod when
  # the dev deploy succeeds (same contract echopoint and anchor use).
  dispatch-deploy-dev:
    name: Dispatch Deploy (dev)
    needs: docker-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: nanostack-dev/ci-workflows/.github/workflows/dispatch-deploy-event.yml@main
    permissions:
      contents: read
    with:
      runner: ubuntu-latest
      deploy_repository: nanostack-dev/infra
      event_type: deploy-service
      payload: >-
        {"service":"echopoint-runner","environment":"dev","promote_to_prod":true,"source_repository":"${{ github.repository }}","source_ref":"${{ github.sha }}","image_repository":"ghcr.io/${{ github.repository_owner }}/echopoint-runner","image_tag":"${{ needs.docker-push.outputs.deploy_image_tag }}","git_sha":"${{ github.sha }}"}
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
